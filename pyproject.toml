[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coldstart"
version = "0.1.0"
description = "Cold-start change detection for NISAR L-band backscatter: a scene-pooled conditional model with conformal false-alarm control"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "h5py>=3.10",
    "scikit-learn>=1.4",
    "rasterio>=1.3.9",
    "shapely>=2.0",
    "pyproj>=3.6",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "asf_search",
    "streamlit>=1.45",
    "folium>=0.15",
    "streamlit-folium>=0.18",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
coldstart = "coldstart.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
